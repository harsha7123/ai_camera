[project]
name = "zeoatap-vision"
version = "0.1.0"
description = "Camera ingest, health checks and evidence ring buffer for the Zeoatap edge appliance"
requires-python = ">=3.12"
dependencies = [
  "av>=14.0,<16",
  "numpy>=2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "jsonschema>=4.23",
]

[project.scripts]
zeoatap-vision = "zeoatap_vision.__main__:main"

[project.optional-dependencies]
pose = [
    "onnxruntime>=1.20",
    "rtmlib==0.0.16",
]
# Luxonis OAK PoE cameras (on-camera person detection). DepthAI 2.x builds
# the camera pipeline offline, so it can be checked without hardware.
oak = [
    "depthai>=2.30,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeoatap_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
